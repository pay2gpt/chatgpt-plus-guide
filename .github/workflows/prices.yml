# Pay2GPT's prices live in its database. Once a day, and whenever asked, this rewrites the price block of every README
# from https://pay2gpt.com/prices.json and commits the change, so no price here is typed by hand (script/update_prices.py).
name: Sync prices
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["script/update_prices.py", ".github/workflows/prices.yml"]
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the price blocks
        run: python3 script/update_prices.py
      - name: Commit when a price changed
        run: |
          if git diff --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync prices with pay2gpt.com"
          git push
