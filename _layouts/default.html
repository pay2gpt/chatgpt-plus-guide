<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | strip_html }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {%- for t in site.translations %}
  <link rel="alternate" hreflang="{{ t.lang }}" href="{{ t.path | absolute_url }}">
  {%- endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ '/README.en.html' | absolute_url }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title | strip_html | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": {{ page.title | strip_html | jsonify }},
    "description": {{ page.description | jsonify }},
    "inLanguage": {{ page.lang | default: site.lang | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "dateModified": {{ site.last_verified | date: "%Y-%m-%d" | jsonify }},
    "isBasedOn": "https://github.com/{{ site.repository }}",
    "author": {"@type": "Organization", "name": "Pay2GPT", "url": "https://pay2gpt.com/"},
    "publisher": {"@type": "Organization", "name": "Pay2GPT", "url": "https://pay2gpt.com/"},
    "about": [{"@type": "Thing", "name": "ChatGPT Plus"}, {"@type": "Thing", "name": "ChatGPT Pro"}, {"@type": "Thing", "name": "ChatGPT Go"}]
  }
  </script>
  <style>
    :root { color-scheme: light dark; --ink: #1b2230; --muted: #5d6676; --rule: #e1e5ec; --paper: #fff; --soft: #f5f7fa; --accent: #0f6b5c; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e6e9ef; --muted: #a2aab8; --rule: #2c3340; --paper: #12161d; --soft: #1a1f28; --accent: #5cc5b0; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif; }
    main { width: min(100% - 32px, 780px); margin: 40px auto 64px; }
    a { color: var(--accent); text-underline-offset: .18em; }
    h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 .6em; }
    h2 { margin-top: 2.2em; padding-top: .6em; border-top: 1px solid var(--rule); font-size: 1.4rem; }
    h3 { margin-top: 1.6em; font-size: 1.1rem; }
    blockquote { margin: 1.2em 0; padding: .6em 1em; background: var(--soft); border-left: 3px solid var(--accent); color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: .95rem; display: block; overflow-x: auto; }
    th, td { padding: .5em .7em; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
    th { background: var(--soft); }
    code { background: var(--soft); padding: .1em .35em; border-radius: 4px; font-size: .9em; }
    footer { width: min(100% - 32px, 780px); margin: 0 auto 48px; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--rule); padding-top: 16px; }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>
  <footer>
    Source: <a href="https://github.com/{{ site.repository }}">github.com/{{ site.repository }}</a> · Last verified {{ site.last_verified | date: "%Y-%m-%d" }} · <a href="https://pay2gpt.com/?utm_source=github&amp;utm_medium=pages&amp;utm_campaign=guide">pay2gpt.com</a>
  </footer>
</body>
</html>
